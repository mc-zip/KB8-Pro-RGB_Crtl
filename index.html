<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七彩虹 KB8 Pro 灯光控制</title>
<meta name="description" content="七彩虹 KB8 Pro 键盘灯光快捷键速查表">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  color-scheme: light dark;
  --page: #F9F7FF;
  --card: #FFFFFF;
  --surface: #F6F2FF;
  --text: #1E1836;
  --muted: #6B6486;
  --border: rgba(78, 55, 140, 0.13);
  --brand: #7C5AF8;
  --brand-text: #4B2FB5;
  --brand-soft: #EDE7FF;
  --row-hover: #FAF7FF;
  --key-bg: #FFFFFF;
  --key-border: rgba(124, 90, 248, 0.32);
  --key-shadow: 0 1px 0 rgba(124, 90, 248, 0.08);
  --shadow: 0 1px 2px rgba(60, 38, 130, 0.05), 0 18px 40px -24px rgba(60, 38, 130, 0.35);
}

@media (prefers-color-scheme: dark) {
  :root {
    --page: #0F0B1A;
    --card: #191324;
    --surface: #221A34;
    --text: #ECE7FA;
    --muted: #A69CC6;
    --border: rgba(166, 156, 198, 0.16);
    --brand: #A78BFA;
    --brand-text: #D6C8FF;
    --brand-soft: rgba(167, 139, 250, 0.14);
    --row-hover: rgba(167, 139, 250, 0.06);
    --key-bg: #221A34;
    --key-border: rgba(167, 139, 250, 0.35);
    --key-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -24px rgba(0, 0, 0, 0.75);
  }
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--page);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 720px;
  margin: 56px auto;
  padding: 44px 40px 48px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
}

header { margin-bottom: 26px; }

.tag {
  display: inline-block;
  margin-bottom: 14px;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand-text);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.tag::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--brand);
  vertical-align: 1px;
}

h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}

thead th {
  padding: 10px 18px;
  background: var(--surface);
  color: var(--brand-text);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-align: left;
}

thead th:first-child { border-radius: 10px 0 0 10px; }
thead th:last-child { border-radius: 0 10px 10px 0; }

td {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

tbody tr:last-child td { border-bottom: none; }

tbody tr { transition: background-color 120ms ease; }
tbody tr:hover { background: var(--row-hover); }

th:first-child,
td:first-child { width: 236px; }

kbd {
  display: inline-block;
  min-width: 28px;
  padding: 2px 9px 3px;
  border: 1px solid var(--key-border);
  border-bottom-width: 2px;
  border-radius: 7px;
  background: var(--key-bg);
  box-shadow: var(--key-shadow);
  color: var(--brand-text);
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.5;
  text-align: center;
}

.or {
  padding: 0 4px;
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 620px) {
  main {
    margin: 16px;
    padding: 28px 20px 32px;
    border-radius: 16px;
  }
  h1 { font-size: 22px; }
  thead th,
  td {
    padding-left: 12px;
    padding-right: 12px;
  }
  th:first-child,
  td:first-child { width: auto; }
  kbd {
    padding: 2px 7px 3px;
    font-size: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  tbody tr { transition: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <span class="tag">快捷键速查</span>
    <h1>七彩虹 KB8 Pro 灯光控制</h1>
  </header>

  <table>
    <thead>
      <tr>
        <th scope="col">按键</th>
        <th scope="col">效果</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><kbd>FN</kbd> + <kbd>TAB</kbd></td>
        <td>开关灯光</td>
      </tr>
      <tr>
        <td><kbd>FN</kbd> + <kbd>Q</kbd><span class="or">\</span><kbd>A</kbd></td>
        <td>切换灯光模式(顺\逆)</td>
      </tr>
      <tr>
        <td><kbd>FN</kbd> + <kbd>W</kbd><span class="or">\</span><kbd>S</kbd></td>
        <td>增加\降低亮度</td>
      </tr>
      <tr>
        <td><kbd>FN</kbd> + <kbd>R</kbd><span class="or">\</span><kbd>F</kbd></td>
        <td>增加\降低光效色彩丰富度</td>
      </tr>
      <tr>
        <td><kbd>FN</kbd> + <kbd>T</kbd><span class="or">\</span><kbd>G</kbd></td>
        <td>增加\降低光效速度</td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
